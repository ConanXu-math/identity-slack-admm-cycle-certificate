schema_version: 1
comparison_id: codex-period66_vs_kimi-period23
comparison_kind: descriptive_endpoint_aligned
purpose: >-
  Describe two realized AI-assisted routes to an exact, replayable
  nonconvergence certificate for direct three-block slack ADMM.

research_scope:
  same_research_question: true
  shared_question: >-
    Does the identity/slack third block, by itself, guarantee convergence of
    the unmodified direct three-block ADMM?
  same_problem_class: true
  same_qp_instance: false
  route_instances:
    codex-period66:
      dimension: 2
      arithmetic: rational
      result: bounded non-KKT sequence of minimal period 66
    kimi-period23:
      dimension: 3
      arithmetic: exact dyadic rational at the route endpoint
      result: >-
        nonconstant period-23 non-KKT orbit, locally attracting in the reduced
        (y,t) state by strict signs and exact Jury stability; explicit
        pairwise-distinctness and minimal-period guards were added during
        post-route release hardening without changing the candidate

common_endpoint:
  id: first_exact_replayable_nonconvergence_certificate
  definition: >-
    The first route-local artifact set that exactly replays a valid
    nonconstant non-KKT periodic ADMM sequence, verifies strict projection
    consistency, and can be rerun without relying on the exploratory
    transcript. The public release verifiers subsequently harmonize explicit
    pairwise-distinctness, minimal-period, and fail-closed guards without
    changing either route's candidate.
  alignment_claim: >-
    same post-hoc-harmonized evidence class, not byte-identical terminal
    verifier scope
  alignment_does_not_mean:
    - same QP instance
    - same search space
    - same hardware or software environment
    - same wall-clock budget
    - same token accounting system
    - same tool access
    - same human intervention policy

control_status:
  controlled_benchmark: false
  compute_matched: false
  intervention_matched: false
  tooling_matched: false
  telemetry_directly_comparable: false
  preregistered_head_to_head: false
  causal_model_ranking_allowed: false

cross_route_information:
  kimi_started_from_problem_statement: true
  codex_candidate_supplied_to_kimi: false
  kimi_starting_materials:
    - problem statement
    - three teacher-provided slides
    - generic research and evidence rules
  prescribed_counterexample_method: false
  note: >-
    Absence of the Codex candidate from the Kimi starting workspace reduces
    direct candidate transfer; it does not make the two routes a controlled
    capability experiment.

human_involvement:
  present: true
  codex-period66:
    active_during_route: true
    roles:
      - problem specification
      - evidence requirements
      - search-priority decisions
  kimi-period23:
    frozen_starting_workspace: true
    post_hoc_audit: true
    preregistered: false
    experiment_specific_kimi_home_used: false
    operating_system_filesystem_denial_enforced: false
    note: >-
      The public provenance does not use an unverified claim of zero human
      involvement or operating-system-enforced isolation as a comparison
      advantage. The retained session record supports the model attribution,
      starting-workspace contents, and generic continue-search prompts.

artifact_boundary:
  native_session_records_retained_privately: true
  raw_chat_or_wire_logs_published: false
  sensitive_local_paths_published: false
  credentials_published: false
  route_records_are_curated: true
  kimi_terminal_artifacts:
    - source binary64 data interpreted as exact dyadic rationals
    - exact period-23 replay
    - exact Jury stability verification
  kimi_post_route_release_strengthening:
    terminal_run_artifact: false
    charged_to_route_time_or_tokens: false
    artifacts:
      - canonical denominator-100 rational QP data
      - exact period-23 raw ADMM replay
      - exact rational Lyapunov and support-radius certificate
  accounting_boundary: >-
    Recorded route timing ends at the first exact dyadic replay and Jury
    certificate. It excludes subsequent construction and regeneration of the
    denominator-100 canonical release certificate and its explicit invariant
    ellipsoid.

interpretation: >-
  The records support a descriptive comparison of two successful research
  routes. They do not support a causal claim that one model, agent system, or
  workflow is faster, cheaper, or more capable than the other.
