name: Exact certificate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python 3.13.5 / SymPy 1.13.3
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the frozen source
        uses: actions/checkout@v4

      - name: Set up Python 3.13.5
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
          cache: pip

      - name: Install the exact dependency set
        run: python -m pip install -r requirements.txt

      - name: Regenerate and compare both certificates
        run: python verify_certificate_pair.py

      - name: Compare the tracked MATLAB and Python exact fields
        run: python verify_matlab_certificate.py

      - name: Require byte-for-byte stable certificate artifacts
        run: >-
          git diff --exit-code --
          certificate_raw.json
          certificate_signed.json
          instance_manifest.json
          certificate_matlab.json

      - name: Upload the generated certificate bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-period-66-certificate
          path: |
            certificate_raw.json
            certificate_signed.json
            instance_manifest.json
            certificate_matlab.json
