name: Exact certificate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python 3.13.5 / SymPy 1.13.3 / NumPy 2.1.3
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the frozen source
        uses: actions/checkout@v4

      - name: Set up Python 3.13.5
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
          cache: pip

      - name: Install the exact dependency set
        run: python -m pip install -r requirements.txt

      - name: Regenerate and verify all exact certificates
        run: python python/verify_all.py

      - name: Run certificate regression tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Compare the tracked MATLAB and Python exact fields
        run: python python/verify_matlab_certificate.py

      - name: Require byte-for-byte stable certificate artifacts
        run: git diff --exit-code -- certificates/

      - name: Upload the generated certificate bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-certificate-bundle
          path: certificates/
